<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <h1>REGISTRO CIVIL MUNICIPAL DE JIMÉNEZ</h1>
                <p class="slogan">✦ Panel de Administración ✦</p>
            </div>
            <nav>
                <a href="index.html"><i class="fas fa-home"></i> Inicio</a>
                <a href="#" onclick="logout()" style="background: #dc3545; padding: 8px 20px; border-radius: 25px;">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </a>
            </nav>
        </div>
    </header>

    <section class="admin-panel">
        <div class="container">
            <div class="admin-header">
                <div>
                    <h2 style="color: #0a1628;">
                        <i class="fas fa-user-shield" style="color: #ffd700;"></i> 
                        Bienvenido, <span id="adminNombre">Administrador</span>
                    </h2>
                    <p style="color: #666; margin-top: 5px;">
                        <i class="fas fa-calendar-alt"></i> <span id="fechaActual"></span>
                    </p>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="admin_citas.html" class="btn-add">
                        <i class="fas fa-calendar-check"></i> Gestionar Citas
                    </a>
                    <a href="admin_requisitos.html" class="btn-add" style="background: #0a1628; color: white;">
                        <i class="fas fa-list"></i> Gestionar Requisitos
                    </a>
                </div>
            </div>

            <!-- Estadísticas -->
            <div id="estadisticas" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px;">
                <div style="background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.06); border-top: 4px solid #0a1628;">
                    <div style="font-size: 2.5rem; color: #0a1628;" id="totalCitas">0</div>
                    <p style="color: #666; font-weight: 500;">Total Citas</p>
                </div>
                <div style="background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.06); border-top: 4px solid #ffc107;">
                    <div style="font-size: 2.5rem; color: #ffc107;" id="pendientes">0</div>
                    <p style="color: #666; font-weight: 500;">Pendientes</p>
                </div>
                <div style="background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.06); border-top: 4px solid #28a745;">
                    <div style="font-size: 2.5rem; color: #28a745;" id="confirmadas">0</div>
                    <p style="color: #666; font-weight: 500;">Confirmadas</p>
                </div>
                <div style="background: white; padding: 25px; border-radius: 12px; text-align: center; box-shadow: 0 3px 15px rgba(0,0,0,0.06); border-top: 4px solid #dc3545;">
                    <div style="font-size: 2.5rem; color: #dc3545;" id="canceladas">0</div>
                    <p style="color: #666; font-weight: 500;">Canceladas</p>
                </div>
            </div>

            <!-- Últimas citas -->
            <div style="background: white; padding: 25px; border-radius: 12px; box-shadow: 0 3px 15px rgba(0,0,0,0.06);">
                <h3 style="color: #0a1628; margin-bottom: 20px;">
                    <i class="fas fa-clock" style="color: #ffd700;"></i> Últimas Citas
                </h3>
                <div id="listaCitas">
                    <p style="text-align: center; color: #999; padding: 30px;">
                        <i class="fas fa-spinner fa-spin"></i> Cargando citas...
                    </p>
                </div>
            </div>
        </div>
    </section>

    <script>
        // Verificar autenticación
        if (!localStorage.getItem('admin_logueado')) {
            window.location.href = 'admin_login.html';
        }

        document.getElementById('adminNombre').textContent = localStorage.getItem('admin_nombre') || 'Administrador';
        document.getElementById('fechaActual').textContent = new Date().toLocaleString('es-ES');

        // Cargar estadísticas
        cargarEstadisticas();

        async function cargarEstadisticas() {
            try {
                const response = await fetch('/.netlify/functions/obtener-estadisticas');
                const data = await response.json();
                document.getElementById('totalCitas').textContent = data.total || 0;
                document.getElementById('pendientes').textContent = data.pendientes || 0;
                document.getElementById('confirmadas').textContent = data.confirmadas || 0;
                document.getElementById('canceladas').textContent = data.canceladas || 0;

                // Cargar últimas citas
                const resCitas = await fetch('/.netlify/functions/obtener-citas');
                const citas = await resCitas.json();
                const contenedor = document.getElementById('listaCitas');
                
                if (citas.length === 0) {
                    contenedor.innerHTML = `<p style="text-align: center; color: #999; padding: 30px;"><i class="fas fa-inbox"></i> No hay citas registradas</p>`;
                } else {
                    const citasRecientes = citas.slice(0, 5);
                    contenedor.innerHTML = `
                        <table class="admin-table">
                            <thead>
                                <tr>
                                    <th>Nombre</th>
                                    <th>Tipo</th>
                                    <th>Fecha</th>
                                    <th>Estado</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${citasRecientes.map(cita => `
                                    <tr>
                                        <td>${escapeHTML(cita.nombre_completo)}</td>
                                        <td>${escapeHTML(cita.tipo_acta)}</td>
                                        <td>${new Date(cita.fecha).toLocaleDateString('es-ES')}</td>
                                        <td><span class="status-${cita.estado}">${cita.estado}</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    `;
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        function escapeHTML(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function logout() {
            if (confirm('¿Estás seguro de cerrar sesión?')) {
                localStorage.removeItem('admin_logueado');
                localStorage.removeItem('admin_nombre');
                localStorage.removeItem('admin_email');
                window.location.href = 'admin_login.html';
            }
        }
    </script>
</body>
</html>
